<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Reporte seguro y confidencial en Elige Tu Vida">
  <title>Reporte Seguro | Elige Tu Vida</title>
  
  <!-- Favicon apuntando al archivo original Favicon Hack -->
  <link rel="icon" href="Favicon Hack.png" type="image/png">
  
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --navy: #0f1f46;
      --indigo: #3730a3;
      --blue: #2563eb;
      --light-blue: #eff6ff;
      --gray: #64748b;
      --text: #1e293b;
      --bg: #f8fafc;
      --white: #ffffff;
      --line: #e2e8f0;
      --success: #10b981;
    }
    
    * { box-sizing: border-box; }
    html { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; transition: all 0.2s ease; }
    
    .container { width: min(1120px, calc(100% - 40px)); margin: auto; }
    
    /* Header en armonía visual con la página principal */
    header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 50; }
    .nav-container { display: flex; align-items: center; justify-content: space-between; min-height: 80px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    
    /* Logo referenciando directamente a Favicon Hack */
    .brand-icon { width: 44px; height: 44px; object-fit: contain; }
    
    .brand-text strong { display: block; color: var(--navy); font-size: 20px; font-weight: 800; line-height: 1.1; }
    .brand-text small { display: block; color: var(--gray); font-size: 12px; font-weight: 600; }
    
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-links a { font-size: 14px; font-weight: 600; color: var(--gray); }
    .nav-links a:hover { color: var(--blue); }
    
    /* Botones y Badges */
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; border: none; }
    .btn-primary { background: var(--blue); color: var(--white); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); width: 100%; padding: 14px; font-size: 16px; }
    .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
    .btn-outline { border: 2px solid var(--line); color: var(--navy); background: transparent; }
    .btn-outline:hover { border-color: var(--blue); color: var(--blue); background: var(--light-blue); }
    
    .user-badge-container { display: flex; align-items: center; gap: 10px; background: var(--light-blue); padding: 6px 14px 6px 6px; border-radius: 30px; border: 1px solid #bfdbfe; }
    .user-avatar-circle { width: 32px; height: 32px; background: var(--indigo); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
    
    /* Formulario de Reporte */
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 0; }
    .report-card { background: var(--white); border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 10px 25px rgba(15, 31, 70, 0.05); max-width: 640px; width: 100%; padding: 40px; }
    
    .report-header { text-align: center; margin-bottom: 32px; }
    .report-header h1 { font-size: 28px; font-weight: 800; color: var(--navy); margin: 0 0 8px; }
    .report-header p { color: var(--gray); font-size: 15px; margin: 0; }
    
    .form-group { margin-bottom: 24px; }
    .form-label { display: block; font-size: 14px; font-weight: 600; color: var(--navy); margin-bottom: 8px; }
    .form-control { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-family: inherit; font-size: 15px; color: var(--text); transition: all 0.2s; }
    .form-control:focus { outline: none; border-color: var(--blue); background: var(--white); box-shadow: 0 0 0 3px var(--light-blue); }
    textarea.form-control { resize: vertical; min-height: 120px; }
    
    .anonymous-toggle { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--light-blue); border-radius: 8px; border: 1px solid #bfdbfe; margin-bottom: 32px; }
    .anonymous-toggle input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--blue); cursor: pointer; }
    .anonymous-toggle label { font-size: 14px; font-weight: 600; color: var(--navy); cursor: pointer; display: flex; flex-direction: column; }
    .anonymous-toggle label span { font-size: 12px; color: var(--gray); font-weight: 400; margin-top: 2px; }
    
    .file-drop-area { border: 2px dashed var(--line); border-radius: 8px; padding: 24px; text-align: center; background: var(--bg); cursor: pointer; transition: all 0.2s; display: block; }
    .file-drop-area:hover { border-color: var(--blue); background: var(--light-blue); }
    .file-drop-text { font-size: 14px; color: var(--gray); margin: 0; }
    .file-drop-text strong { color: var(--blue); }
    .file-input { display: none; }

    footer { background: #0f172a; padding: 30px 0; color: #94a3b8; text-align: center; font-size: 14px; border-top: 1px solid #1e293b; }
    
    @media (max-width: 600px) {
      .nav-links { display: none; }
      .report-card { padding: 24px; border-radius: 0; border: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav-container">
      <a class="brand" href="index.html">
        <!-- Logo apuntando exactamente a la imagen del sistema -->
        <img src="Favicon Hack.png" alt="Logo Elige Tu Vida" class="brand-icon">
        <span class="brand-text">
          <strong>Elige Tu Vida</strong>
          <small>Reporte Seguro</small>
        </span>
      </a>
      
      <nav id="nav-options" class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="chat.html">Chat de apoyo</a>
        <a href="login.html" id="nav-login" class="btn btn-outline" style="padding: 8px 16px;">Volver al panel</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="report-card">
        <div class="report-header">
          <h1>Crear un reporte</h1>
          <p>Este espacio es confidencial. La información que registres estará protegida.</p>
        </div>
        
        <form action="procesar_reporte.php" method="POST" enctype="multipart/form-data">
          
          <div class="form-group">
            <label class="form-label" for="tipo_reporte">¿De qué trata la situación?</label>
            <select class="form-control" id="tipo_reporte" name="tipo_reporte" required>
              <option value="" disabled selected>Selecciona una categoría...</option>
              <option value="acoso">Acoso escolar (Bullying)</option>
              <option value="ciberacoso">Ciberacoso o problemas digitales</option>
              <option value="violencia">Violencia física o verbal</option>
              <option value="emocional">Bienestar emocional</option>
              <option value="otro">Otra situación</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="lugar_fecha">Lugar y fecha aproximada</label>
            <input type="text" class="form-control" id="lugar_fecha" name="lugar_fecha" placeholder="Ej: En la cancha principal, ayer en el descanso" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="descripcion">Descripción del caso</label>
            <textarea class="form-control" id="descripcion" name="descripcion" placeholder="Describe lo sucedido de la forma más clara posible..." required></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Adjuntar evidencia (Opcional)</label>
            <label class="file-drop-area" for="evidencia">
              <p class="file-drop-text" id="file-label-text"><strong>Haz clic para subir un archivo</strong> o arrástralo aquí</p>
              <p class="file-drop-text" style="font-size: 12px; margin-top: 4px;">Imágenes, PDF o documentos (Max. 10MB)</p>
              <input type="file" id="evidencia" name="evidencia" class="file-input" accept="image/*,.pdf,.doc,.docx">
            </label>
          </div>

          <div class="anonymous-toggle">
            <input type="checkbox" id="anonimo" name="anonimo" value="si">
            <label for="anonimo">
              Enviar este reporte de forma anónima
              <span>Tu nombre no será visible para el equipo institucional.</span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary">Enviar reporte seguro</button>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 Elige Tu Vida — Plataforma de convivencia y protección escolar.</p>
    </div>
  </footer>

  <script type="module">
    import { supabase } from './conexion.js';

    // Manejo de la etiqueta de archivo adjunto
    const fileInput = document.getElementById('evidencia');
    const dropText = document.getElementById('file-label-text');

    if (fileInput && dropText) {
      fileInput.addEventListener('change', function() {
        if (this.files && this.files.length > 0) {
          dropText.innerHTML = `<strong style="color: var(--success);">Archivo cargado: ${this.files[0].name}</strong>`;
        } else {
          dropText.innerHTML = '<strong>Haz clic para subir un archivo</strong> o arrástralo aquí';
        }
      });
    }

    // Validación de sesión activa
    document.addEventListener("DOMContentLoaded", async () => {
        const navLogin = document.getElementById("nav-login");
        const navContainer = document.getElementById("nav-options");

        try {
            const { data: { session } } = await supabase.auth.getSession();
            const localUser = JSON.parse(localStorage.getItem("usuario") || sessionStorage.getItem("usuario") || "null");

            const userName = session?.user?.user_metadata?.nombre || localUser?.nombre;

            if (userName) {
                if (navLogin) navLogin.remove();
                
                const userBadge = document.createElement("div");
                userBadge.className = "user-badge-container";
                const initial = userName.charAt(0).toUpperCase();
                
                userBadge.innerHTML = `
                  <div class="user-avatar-circle">${initial}</div>
                  <span style="font-size: 13px; font-weight: 700; color: var(--navy);">${userName}</span>
                `;
                navContainer.appendChild(userBadge);
            }
        } catch(e) {
            console.error("Error al validar sesión:", e);
        }
    });
  </script>
</body>
</html>
