<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel de administración y gestión institucional para Elige Tu Vida.">
  <title>Panel de Administración | Elige Tu Vida</title>

  <link rel="icon" href="assets/images/Favicon Hack.png" type="image/png">
  <meta name="theme-color" content="#0f1f46">

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <style>
    :root {
      --etv-navy: #0b1f48;
      --etv-blue: #1559b7;
      --etv-blue-dark: #103c81;
      --etv-sky: #e0f2fe;
      --etv-ink: #1c2b43;
      --etv-muted: #64748b;
      --etv-line: #e2e8f0;
      --etv-soft: #f8fafc;
      --shadow-lg: 0 10px 25px -5px rgba(15, 31, 70, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--etv-ink);
      background: var(--etv-soft);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--etv-line);
    }
    .site-nav { display: flex; align-items: center; justify-content: space-between; min-height: 78px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand strong { color: var(--etv-navy); font-size: 18px; font-weight: 800; }
    .brand small { color: var(--etv-muted); font-size: 12px; font-weight: 600; display: block; }

    .container { width: min(1240px, calc(100% - 48px)); margin-inline: auto; }

    .card {
      background: #ffffff;
      border: 1px solid var(--etv-line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 24px;
    }

    .badge-admin {
      background: #eff6ff;
      color: var(--etv-blue);
      border: 1px solid #bfdbfe;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { background: #f8fafc; color: var(--etv-muted); font-weight: 700; padding: 12px 16px; border-bottom: 2px solid var(--etv-line); font-size: 12px; text-transform: uppercase; }
    td { padding: 14px 16px; border-bottom: 1px solid var(--etv-line); color: #334155; }
    tr:hover td { background: #f8fafc; }

    .btn-action {
      background: var(--etv-blue);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      transition: background 0.2s;
    }
    .btn-action:hover { background: var(--etv-blue-dark); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-nav">
      <a class="brand" href="index.html">
        <img src="assets/images/Escudo Elige Tu Vida Hack.png" alt="Logo" width="44" height="44" style="object-fit: contain;">
        <span>
          <strong>Elige Tu Vida</strong>
          <small>Panel de Control Institucional</small>
        </span>
      </a>
      <div class="flex items-center gap-4">
        <span class="badge-admin">Administrador</span>
        <button id="btn-logout" class="text-sm font-bold text-red-600 hover:underline">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="flex-1 py-8 container">
    
    <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold" style="color: var(--etv-navy);">Gestión de Contactos y Solicitudes</h1>
        <p class="text-gray-500 text-sm mt-1">Revisa los mensajes enviados por los usuarios desde la plataforma.</p>
      </div>
      <div class="card !mb-0 !p-4 flex items-center gap-4 bg-white">
        <div>
          <span class="text-xs font-bold uppercase text-gray-400 block">Total de Mensajes</span>
          <span id="total-messages-count" class="text-2xl font-extrabold text-blue-900">0</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold" style="color: var(--etv-navy);">Bandeja de Entrada de Contactos</h2>
        <button id="btn-refresh" class="text-xs font-bold text-blue-600 hover:underline">Actualizar datos</button>
      </div>

      <div class="table-container" id="admin-table-wrapper">
        <p class="text-sm text-gray-500 py-4 text-center">Cargando registros institucionales...</p>
      </div>
    </div>

  </main>

  <script type="module">
    import { supabase } from './conexion.js';

    // CONFIGURACIÓN DE SEGURIDAD: Define el correo autorizado como administrador
    const ADMIN_EMAIL = "eligetuvidareportes@gmail.com";

    document.addEventListener("DOMContentLoaded", async () => {
        // 1. Verificar sesión activa
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();
        
        if (sessionError || !session) {
            alert("Debes iniciar sesión para acceder al panel de administración.");
            window.location.href = "login.html";
            return;
        }

        const user = session.user;

        // 2. Validar que el usuario sea el administrador autorizado
        if (user.email !== ADMIN_EMAIL) {
            alert("Acceso denegado. No cuentas con permisos de administrador.");
            window.location.href = "index.html";
            return;
        }

        // 3. Función para cargar los mensajes de contacto
        async function fetchContactMessages() {
            const wrapper = document.getElementById("admin-table-wrapper");
            const counter = document.getElementById("total-messages-count");

            const { data: contactos, error } = await supabase
                .from('contactos')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                wrapper.innerHTML = `<p class="text-sm text-red-600 py-4 text-center">Error al cargar los datos: ${error.message}</p>`;
                return;
            }

            counter.textContent = contactos ? contactos.length : 0;

            if (!contactos || contactos.length === 0) {
                wrapper.innerHTML = `<p class="text-sm text-gray-500 py-6 text-center">No hay mensajes registrados en este momento.</p>`;
                return;
            }

            let html = `
              <table>
                <thead>
                  <tr>
                    <th>Remitente</th>
                    <th>Correo</th>
                    <th>Asunto</th>
                    <th>Mensaje</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody>
            `;

            contactos.forEach(item => {
                html += `
                  <tr>
                    <td class="font-bold text-gray-900">${item.nombre || 'Sin nombre'}</td>
                    <td><a href="mailto:${item.correo}" class="text-blue-600 hover:underline">${item.correo}</a></td>
                    <td class="font-semibold text-gray-800">${item.asunto}</td>
                    <td class="text-gray-600 max-w-xs truncate" title="${item.mensaje}">${item.mensaje}</td>
                    <td>
                      <a href="mailto:${item.correo}?subject=Respuesta a su solicitud: ${encodeURIComponent(item.asunto)}" class="btn-action inline-block text-center">Responder</a>
                    </td>
                  </tr>
                `;
            });

            html += `</tbody></table>`;
            wrapper.innerHTML = html;
        }

        // Cargar mensajes al iniciar
        await fetchContactMessages();

        // Botón de actualizar
        document.getElementById("btn-refresh").addEventListener("click", async () => {
            document.getElementById("admin-table-wrapper").innerHTML = `<p class="text-sm text-gray-500 py-4 text-center">Actualizando...</p>`;
            await fetchContactMessages();
        });

        // Botón de cerrar sesión
        document.getElementById("btn-logout").addEventListener("click", async () => {
            await supabase.auth.signOut();
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = "login.html";
        });
    });
  </script>
</body>
</html>
