<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel de administración de Elige Tu Vida.">
  <meta name="theme-color" content="#0b1f48">
  <title>Administración | Elige Tu Vida</title>
  <link rel="icon" href="assets/images/Favicon Hack.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { etv: { navy: '#0b1f48', blue: '#1559b7', sky: '#e0f2fe', indigo: '#3730a3' } },
          boxShadow: { panel: '0 18px 45px -24px rgba(11, 31, 72, .28)' }
        }
      }
    };
  </script>
  <style>[data-app-loading] { visibility: hidden; }</style>
  <script type="module" src="global-auth.js"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800" data-app-loading>
  <header class="border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex min-h-20 w-[min(1240px,calc(100%-2rem))] items-center justify-between gap-4">
      <a href="index.html" class="flex min-w-0 items-center gap-3" aria-label="Ir al inicio de Elige Tu Vida">
        <img src="assets/images/Escudo Elige Tu Vida Hack.png" alt="Logo Elige Tu Vida" class="h-11 w-11 shrink-0 object-contain">
        <span class="min-w-0"><strong class="block truncate text-base font-extrabold text-etv-navy sm:text-lg">Elige Tu Vida</strong><small class="block truncate text-xs font-medium text-slate-500">Control institucional</small></span>
      </a>
      <div class="flex items-center gap-3"><span class="hidden rounded-full bg-etv-sky px-3 py-1.5 text-xs font-extrabold text-etv-blue sm:inline">Administrador</span><button id="logoutButton" type="button" class="rounded-lg border border-red-200 px-3 py-2 text-sm font-bold text-red-700 transition hover:bg-red-50 focus:outline-none focus:ring-4 focus:ring-red-100">Cerrar sesión</button></div>
    </div>
  </header>

  <main class="mx-auto w-[min(1240px,calc(100%-2rem))] py-8 sm:py-10">
    <section class="mb-8 flex flex-col justify-between gap-5 md:flex-row md:items-end">
      <div><p class="mb-2 text-xs font-extrabold uppercase tracking-[0.12em] text-etv-blue">Administración segura</p><h1 class="text-3xl font-extrabold tracking-tight text-etv-navy sm:text-4xl">Mensajes institucionales</h1><p id="administratorName" class="mt-2 text-sm leading-6 text-slate-600">Verificando sesión...</p></div>
      <div class="rounded-xl border border-blue-100 bg-white px-5 py-3 shadow-panel"><p class="text-xs font-bold uppercase tracking-wide text-slate-400">Total de mensajes</p><p id="totalCount" class="mt-1 text-2xl font-extrabold text-etv-navy">0</p></div>
    </section>
    <div id="pageAlert" class="mb-6 hidden rounded-xl border px-4 py-3 text-sm" role="status" aria-live="polite"></div>
    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-panel sm:p-7">
      <div class="mb-5 flex flex-col justify-between gap-3 sm:flex-row sm:items-center"><div><h2 class="text-xl font-extrabold text-etv-navy">Bandeja de contacto</h2><p class="mt-1 text-sm text-slate-500">Mensajes enviados desde el formulario de contacto.</p></div><button id="refreshButton" type="button" class="inline-flex items-center justify-center rounded-lg bg-etv-blue px-4 py-2.5 text-sm font-extrabold text-white transition hover:bg-etv-navy focus:outline-none focus:ring-4 focus:ring-blue-200 disabled:cursor-not-allowed disabled:opacity-60">Actualizar</button></div>
      <div class="overflow-x-auto rounded-xl border border-slate-100"><table class="min-w-[880px] w-full divide-y divide-slate-100 text-left text-sm"><thead class="bg-slate-50 text-xs font-bold uppercase tracking-wide text-slate-500"><tr><th class="px-4 py-3">Fecha</th><th class="px-4 py-3">Remitente</th><th class="px-4 py-3">Correo</th><th class="px-4 py-3">Asunto</th><th class="px-4 py-3">Mensaje</th><th class="px-4 py-3">Acción</th></tr></thead><tbody id="contactsBody" class="divide-y divide-slate-100"><tr><td colspan="6" class="px-4 py-8 text-center text-slate-500">Verificando permisos...</td></tr></tbody></table></div>
    </section>
  </main>

  <script type="module">
    import { supabase } from './conexion.js';

    function setBusy(button, busy) { if (!button.dataset.label) button.dataset.label = button.textContent.trim(); button.disabled = busy; button.textContent = busy ? 'Actualizando...' : button.dataset.label; }
    function showAlert(message, type = 'error') { const alert = document.getElementById('pageAlert'); const styles = { error: 'border-red-200 bg-red-50 text-red-800', success: 'border-emerald-200 bg-emerald-50 text-emerald-800' }; alert.className = `mb-6 rounded-xl border px-4 py-3 text-sm ${styles[type]}`; alert.textContent = message; }
    function clearAlert() { const alert = document.getElementById('pageAlert'); alert.className = 'mb-6 hidden rounded-xl border px-4 py-3 text-sm'; alert.textContent = ''; }
    function formatDate(value) { if (!value) return 'Sin fecha'; const date = new Date(value); return Number.isNaN(date.getTime()) ? 'Sin fecha' : new Intl.DateTimeFormat('es-CO', { dateStyle: 'medium', timeStyle: 'short' }).format(date); }
    function cell(text, className = '') { const element = document.createElement('td'); element.className = `px-4 py-3 align-top text-slate-600 ${className}`; element.textContent = text || 'Sin información'; return element; }

    function renderContacts(contactos) {
      const body = document.getElementById('contactsBody'); body.replaceChildren(); document.getElementById('totalCount').textContent = contactos.length;
      if (!contactos.length) { const row = document.createElement('tr'); const empty = document.createElement('td'); empty.colSpan = 6; empty.className = 'px-4 py-10 text-center text-slate-500'; empty.textContent = 'No hay mensajes registrados en este momento.'; row.append(empty); body.append(row); return; }
      contactos.forEach((contacto) => {
        const row = document.createElement('tr'); row.className = 'transition hover:bg-slate-50';
        row.append(cell(formatDate(contacto.created_at), 'whitespace-nowrap text-xs'), cell(contacto.nombre, 'min-w-36 font-bold text-slate-800'), cell(contacto.correo, 'min-w-48 break-all text-etv-blue'), cell(contacto.asunto, 'min-w-40 font-semibold text-slate-800'), cell(contacto.mensaje, 'min-w-72 max-w-sm whitespace-pre-wrap leading-6'));
        const action = document.createElement('td'); action.className = 'px-4 py-3 align-top'; const reply = document.createElement('a'); reply.className = 'inline-flex rounded-lg border border-blue-200 px-3 py-2 text-xs font-extrabold text-etv-blue transition hover:bg-etv-sky focus:outline-none focus:ring-4 focus:ring-blue-100'; reply.textContent = 'Responder'; reply.href = `mailto:${encodeURIComponent(contacto.correo || '')}?subject=${encodeURIComponent(`Respuesta a tu solicitud: ${contacto.asunto || ''}`)}`; action.append(reply); row.append(action); body.append(row);
      });
    }

    async function loadContacts() {
      const body = document.getElementById('contactsBody'); body.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-slate-500">Cargando mensajes...</td></tr>';
      const { data, error } = await supabase.from('contactos').select('id, nombre, correo, asunto, mensaje, created_at').order('created_at', { ascending: false });
      if (error) { renderContacts([]); showAlert('No fue posible cargar los mensajes. Verifica las políticas RLS de la tabla contactos.'); console.error('Error al cargar contactos:', error); return; }
      renderContacts(data || []);
    }

    async function bootstrap() {
      const { data: { session }, error: sessionError } = await supabase.auth.getSession();
      if (sessionError || !session) { window.location.replace('login.html'); return; }
      const { data: profile, error: profileError } = await supabase.from('perfiles').select('nombre, rol').eq('id', session.user.id).maybeSingle();
      if (profileError || profile?.rol !== 'Admin') { console.warn('Acceso administrativo bloqueado:', profileError || 'Rol insuficiente'); window.location.replace('index.html'); return; }
      const name = profile.nombre || session.user.user_metadata?.nombre || session.user.email; document.getElementById('administratorName').textContent = `Sesión de administrador: ${name}`; document.body.removeAttribute('data-app-loading'); await loadContacts();
    }

    document.getElementById('refreshButton').addEventListener('click', async (event) => { clearAlert(); setBusy(event.currentTarget, true); await loadContacts(); setBusy(event.currentTarget, false); });
    document.getElementById('logoutButton').addEventListener('click', async () => { await supabase.auth.signOut(); window.location.replace('login.html'); });
    bootstrap();
  </script>
</body>
</html>
